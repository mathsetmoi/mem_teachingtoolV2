# Met Tableau MEM en ligne sur GitHub Pages à chaque envoi sur « main » :
# le tableau (index.html) et le lecteur des élèves (revoir.html).
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
# Node.js 24 (LTS), et des actions qui tournent elles-mêmes sous Node 24.
name: Mettre en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une mise en ligne commencée va jusqu'au bout ; les suivantes attendent
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
